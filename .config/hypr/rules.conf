# Utility windows retain comfortable traditional desktop behavior.
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:title ^(Open.File|Save.File|Select.a.File)$
windowrule = center on, match:title ^(Open.File|Save.File|Select.a.File)$
windowrule = size 70% 70%, match:title ^(Open.File|Save.File|Select.a.File)$

# Glass surfaces; authored colors remain in their component stylesheets.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.20, match:namespace waybar
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0.20, match:namespace wofi
