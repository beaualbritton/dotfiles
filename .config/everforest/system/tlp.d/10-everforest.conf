# Conservative ThinkPad T470 policy. Source of truth:
# ~/.config/everforest/system/tlp.d/10-everforest.conf
TLP_ENABLE=1

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
USB_AUTOSUSPEND=1

# Charge thresholds are intentionally unset until `tlp-stat -b` confirms that
# the installed batteries and kernel driver expose supported controls.

