general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(a7c080ee) rgba(83c092ee) 45deg
    col.inactive_border = rgba(374145bb)
    resize_on_border = true
    extend_border_grab_area = 10
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.97
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        ignore_opacity = false
        xray = false
        popups = true
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1b1b1bcc)
        color_inactive = rgba(1b1b1b88)
    }
}

