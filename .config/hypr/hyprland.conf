# monitor
monitor=,preferred,auto,1

# variables
$mod = SUPER

# startup
source = ~/.config/hypr/autostart.conf

# keybinds
source = ~/.config/hypr/keybinds.conf

# appearance
source = ~/.config/hypr/look.conf

# environment
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1

