# ~/.config/hypr/look.conf

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(313244aa)

    resize_on_border = true
    layout = dwindle
}


decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(000000aa)
    }

    active_opacity = 1.0
    inactive_opacity = 0.95
}


animations {
    enabled = true

    bezier = smooth, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 5, smooth
    animation = border, 1, 5, smooth
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 6, smooth
}


misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
